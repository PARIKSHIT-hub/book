<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Our Story — Memory Book</title>
  <style>
    :root{
      --ink:#33271f; --muted:#806b58; --gold:#b99157; --gold2:#d6b77f;
      --paper:#fbf5e8; --paper-edge:#ead9bc; --wine:#4a2028; --shadow:#0b0806;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%}
    body{
      min-height:100vh; overflow:hidden; color:var(--ink);
      font-family:Georgia,"Times New Roman",serif;
      background:
        radial-gradient(circle at 50% 30%,#49352a 0,#241914 38%,#0d0a08 100%);
    }
    body:before{
      content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;
      background-image:radial-gradient(#fff 0.7px,transparent .7px);
      background-size:7px 7px;
    }
    .book-wrap{height:100vh;display:grid;place-items:center;padding:20px 10px 70px}
    .book{
      width:min(600px, 92vw);height:min(850px, 85vh);
      position:relative;perspective:2000px;filter:drop-shadow(0 30px 45px #000a);
    }
    .page{
      position:absolute;inset:0;overflow:hidden;
      background:
        linear-gradient(90deg,#d8c4a3aa 0,transparent 3%,transparent 97%,#cbb58f55 100%),
        repeating-linear-gradient(0deg,transparent 0,transparent 31px,#8d6c4710 32px),
        var(--paper);
      border:1px solid #d5bf99;
      border-radius:4px 12px 12px 4px;
      padding:15px 18px;
      box-shadow:inset 18px 0 30px #79583814,inset -5px 0 15px #79583810,0 8px 20px #0005;
      transform-origin:left center;
      transition:transform .9s cubic-bezier(.2,.8,.15,1),z-index 0s .42s;
    }
    .page:after{
      content:"";position:absolute;top:0;bottom:0;left:13px;width:1px;
      background:#9d784b22;pointer-events:none;
    }
    .page.flipped{transform:rotateY(-180deg);z-index:0}
    .cover{
      background:
        radial-gradient(circle at 50% 35%,#815d42 0,#3b261b 45%,#160f0b 100%);
      color:#f8e9ca;display:grid;place-items:center;text-align:center;
      border:10px solid #2a1b12;outline:2px solid #b9945c;outline-offset:-17px;
    }
    .cover:after{display:none}
    .cover-inner{
      width:90%;padding:30px 20px;
      border:1px solid #c7a56f88;position:relative;
    }
    .cover-inner:before,.cover-inner:after{
      content:"✦";position:absolute;color:var(--gold2);font-size:18px
    }
    .cover-inner:before{top:12px;left:16px}.cover-inner:after{bottom:12px;right:16px}
    .cover h1{
      margin:12px 0 8px;font-size:clamp(44px,6vw,78px);
      font-weight:normal;letter-spacing:-2px;
    }
    .cover p{font:11px Arial,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#dfc79d}
    .cover .photo{
      width:190px;height:235px;margin:0 auto 20px;
      border:7px solid #ead6ac;outline:1px solid #9c7849;
      background:linear-gradient(135deg,#5a4536,#2c211a);
      display:grid;place-items:center;color:#d8c09a;
      font:11px Arial,sans-serif;letter-spacing:1px;
      overflow:hidden;
    }
    .chapter{max-width:820px;margin:auto;height:100%;display:flex;flex-direction:column;justify-content:flex-start;padding-top:5px}
    .kicker{
      font:9px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;
      color:#a77b48;margin-bottom:6px;
    }
    h2{
      font-size:clamp(18px,3vw,26px);line-height:1.1;font-weight:normal;
      margin:0 0 3px;letter-spacing:-0.5px;
    }
    .date{font-style:italic;color:var(--muted);margin-bottom:8px;font-size:12px}
    .chapter p{font-size:clamp(12px,1.3vw,14.5px);line-height:1.45;margin:0 0 8px;max-width:760px}
    .highlight{
      font-size:clamp(14px,2vw,18px)!important;line-height:1.25!important;
      text-align:center;margin:12px auto!important;color:#5a3033;
      cursor: help;
      transition: filter 0.3s, opacity 0.3s;
      filter: blur(4px);
      opacity: 0.5;
    }
    .highlight:hover {
      filter: blur(0);
      opacity: 1;
    }
    .sticker {
      position: absolute;
      font-size: 35px;
      user-select: none;
      pointer-events: auto;
      cursor: grab;
      z-index: 10;
      transition: transform 0.2s;
      filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2));
    }
    .sticker:active { cursor: grabbing; }
    .sticker:hover { transform: scale(1.2) rotate(5deg); }

    .nav{
      position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
      display:flex;align-items:center;gap:14px;z-index:100;
      padding:8px 10px;border:1px solid #b9945c55;border-radius:999px;
      background:#17100cd9;backdrop-filter:blur(12px);
    }
    button{
      border:0;background:transparent;color:#f3dfbc;padding:9px 13px;
      border-radius:999px;cursor:pointer;font:12px Arial,sans-serif;
      letter-spacing:.4px;transition:.2s;
    }
    button:hover{background:#b9915722}
    button:disabled{opacity:.3;cursor:default}
    .counter{color:#cbb28c;font:11px Arial,sans-serif;min-width:65px;text-align:center}
    .hint{
      position:fixed;top:18px;left:50%;transform:translateX(-50%);
      color:#cdb58d;font:10px Arial,sans-serif;letter-spacing:2px;
      text-transform:uppercase;opacity:.75;z-index:110;
    }
    /* Heart Animation */
    .heart {
      position: fixed;
      font-size: 15px;
      color: rgba(201, 75, 87, 0.6);
      user-select: none;
      pointer-events: none;
      z-index: 50;
      animation: floatUp 4s linear forwards;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }

    @media(max-width:700px){
      .book-wrap{padding:10px 5px 70px}.book{width:94vw;height:82vh}
      .page{padding:12px 10px}.chapter{justify-content:flex-start;padding-top:5px}
      .cover-inner{width:95%;padding:15px 10px}.cover .photo{width:130px;height:165px}
      h2{font-size:38px}.chapter p{font-size:16px;line-height:1.68}
      .hint{font-size:8px}
    }
  </style>
  <style>
    .photo-card img{cursor:zoom-in;transition:transform .25s ease,filter .25s ease}
    .photo-card img:hover{transform:scale(1.03);filter:brightness(1.04)}
    .photo-lightbox{
      position:fixed;inset:0;z-index:9999;display:none;place-items:center;
      padding:30px;background:rgba(8,6,5,.88);backdrop-filter:blur(10px);
    }
    .photo-lightbox.open{display:grid}
    .photo-lightbox img{
      max-width:min(92vw,1100px);max-height:88vh;object-fit:contain;
      border:5px solid #ead6ac;box-shadow:0 25px 80px #000;
      border-radius:5px;
    }
    .lightbox-close{
      position:absolute;top:18px;right:20px;width:42px;height:42px;
      border:1px solid #d6b77f88!important;background:#17100ddd!important;
      color:#f4dfba!important;font-size:22px!important;padding:0!important;
    }
  </style>

  <style>
    .photo-library{
      margin:8px auto 0;
      width:100%;
      max-width:820px;
      padding-top:6px;
      border-top:1px solid #b9915738;
    }
    .photo-library-title{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      color:#806b58;font:10px Arial,sans-serif;letter-spacing:2px;
      text-transform:uppercase;margin-bottom:12px;
    }
    .photo-actions{display:flex;gap:7px;flex-wrap:wrap}
    .photo-btn{
      border:1px solid #b9915755!important;background:#fff8ea!important;
      color:#6d533d!important;font:11px Arial,sans-serif!important;
      padding:7px 10px!important;border-radius:999px!important;
    }
    .photo-grid{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
      gap:10px;
    }
    .photo-card{
      position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:2px;
      border:1px solid #ddd;background:#fff;
      padding:4px 4px 12px 4px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transform: rotate(var(--rot, 0deg));
    }
    .photo-card:nth-child(odd) { --rot: -2deg; }
    .photo-card:nth-child(even) { --rot: 2deg; }
    .photo-card:hover { transform: scale(1.1) rotate(0deg); z-index: 10; transition: 0.3s; }
    .photo-card img{width:100%;height:100%;object-fit:cover;display:block}
    .photo-remove{
      position:absolute;right:5px;top:5px;width:25px;height:25px;padding:0!important;
      background:#241914d9!important;color:#fff!important;border:0!important;
      border-radius:50%!important;font-size:12px!important;
    }
    .photo-empty{
      border:1px dashed #a9855e66;border-radius:8px;padding:17px;text-align:center;
      color:#92785f;font:11px Arial,sans-serif;
    }
    .photo-input{display:none}
    @media(max-width:700px){
     .photo-grid{grid-template-columns:repeat(2,1fr)}
     .photo-library-title{align-items:flex-start;flex-direction:column}
    }
  </style>


  <style>
    :root{
      --sky:#87ceeb;
      --sky-deep:#4aa9d0;
      --rose:#b94b55;
      --rose-soft:#d97880;
    }
    body:before{
      background-image:
        radial-gradient(circle at 15% 18%, rgba(135,206,235,.22), transparent 22%),
        radial-gradient(circle at 85% 78%, rgba(185,75,85,.18), transparent 24%),
        radial-gradient(#fff 0.7px,transparent .7px);
      background-size:auto,auto,7px 7px;
    }
    .cover{
      background:
        radial-gradient(circle at 28% 28%,rgba(135,206,235,.28),transparent 25%),
        radial-gradient(circle at 72% 72%,rgba(185,75,85,.28),transparent 25%),
        radial-gradient(circle at 50% 35%,#815d42 0,#3b261b 45%,#160f0b 100%);
    }
    .cover-inner{border-color:rgba(135,206,235,.45)}
    .cover-inner:before{color:var(--sky)}
    .cover-inner:after{color:var(--rose-soft)}
    .kicker{color:var(--sky-deep)}
    .highlight{color:#7b3038}
    .date{color:#86616a}
    .nav{border-color:rgba(135,206,235,.35)}
    button:hover{background:rgba(135,206,235,.14)}
    #progress{background:linear-gradient(90deg,var(--sky),var(--rose-soft))!important}
    .photo-library{border-top-color:rgba(135,206,235,.28)}
    .photo-library-title{color:#66899a}
    .photo-card{border-color:rgba(135,206,235,.35)}
    .photo-placeholder .plus{color:var(--sky-deep)}
  </style>

  <style>
    :root{
     --sky:#87CEEB;
     --sky2:#4FB3D9;
     --sky3:#DDF6FF;
     --red:#C94B57;
     --red2:#E87882;
     --red3:#FFE1E4;
     --ink:#17313B;
     --paper:#F8FDFF;
     --paper2:#EAF8FD;
    }
    body{
     background:
       radial-gradient(circle at 15% 15%,rgba(135,206,235,.28),transparent 28%),
       radial-gradient(circle at 85% 80%,rgba(201,75,87,.24),transparent 30%),
       linear-gradient(135deg,#dff7ff,#fff0f2 52%,#dff7ff);
     color:var(--ink);
    }
    .book{filter:drop-shadow(0 24px 55px rgba(201,75,87,.20))}
    .page{
     background:
       radial-gradient(circle at 90% 10%,rgba(135,206,235,.16),transparent 25%),
       linear-gradient(110deg,var(--paper),#fff);
     border-color:rgba(79,179,217,.45);
    }
    .page:before{border-color:rgba(201,75,87,.16)}

    .chapter p{color:var(--ink)}

    .date{color:var(--red2)!important}
    .highlight{color:var(--red)!important}
    .cover{
     background:
       radial-gradient(circle at 25% 25%,rgba(135,206,235,.38),transparent 27%),
       radial-gradient(circle at 75% 72%,rgba(201,75,87,.38),transparent 30%),
       linear-gradient(145deg,#235a70,#17313b 48%,#7b3038);
     border-color:var(--sky)!important;
    }
    .cover-inner{border-color:rgba(135,206,235,.7)!important}
    .cover-inner h1{color:#fff!important}
    .cover-inner p{color:var(--sky3)!important}
    .cover-inner:before{color:var(--sky)!important}
    .cover-inner:after{color:var(--red2)!important}
    button{
     border-color:rgba(79,179,217,.55)!important;
     background:linear-gradient(135deg,#fff,var(--sky3))!important;
     color:#23566a!important;
    }

     background:linear-gradient(135deg,var(--sky3),var(--red3))!important;
     border-color:var(--red2)!important;
    }
    button:disabled{opacity:.35}
    #progress{background:linear-gradient(90deg,var(--sky),var(--red))!important}
    .nav{background:rgba(255,255,255,.76)!important;border-color:rgba(79,179,217,.4)!important}
    .photo-library{border-top-color:rgba(79,179,217,.4)!important}

    .photo-card{border-color:rgba(201,75,87,.32)!important;background:var(--sky3)!important}
    .photo-placeholder{color:#4c7887!important}
    .photo-placeholder .plus{color:var(--sky2)!important}
    .photo-remove,.lightbox-close{
     background:#8f3945!important;color:white!important;border-color:#e87882!important
    }

  </style>
</head>
<body>
<div class="photo-lightbox" id="photoLightbox">
  <button class="lightbox-close" id="lightboxClose">×</button>
  <img id="lightboxImage" src="" alt="Enlarged memory photo">
</div>
<div class="hint">← →  or swipe  •  turn the pages</div>
<div class="book-wrap">
  <main class="book" id="book"></main>
</div>
<div id="chapterMenu" style="position:fixed;right:18px;top:18px;z-index:120">
  <button id="menuBtn" style="border:1px solid #b9945c66;background:#17100cd9">☰ Chapters</button>
</div>
<div id="drawer" style="position:fixed;right:18px;top:60px;width:min(330px,88vw);max-height:72vh;overflow:auto;
z-index:119;display:none;padding:14px;border:1px solid #b9945c66;border-radius:14px;background:#17100cf2;
backdrop-filter:blur(16px);box-shadow:0 20px 50px #0009">
  <div style="color:#e6cfaa;font:11px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;margin:5px 8px 12px">Table of Contents</div>
  <div id="chapterList"></div>
</div>
<div id="progress" style="position:fixed;left:0;top:0;height:2px;width:0;background:#d6b77f;z-index:200;transition:width .4s"></div>
<div class="nav">
  <button id="prev">← Previous</button>
  <span class="counter" id="counter"></span>
  <button id="next">Next →</button>
</div>

<script>
  const chapters = [
  {
  title:"The Story of Us", cover:true,
  html:`<div class="cover-inner">
  <div class="photo"><img src="assets/cover.jpg" style="width:100%;height:100%;object-fit:cover" alt="Cover Photo"></div>
  <p>A memory book</p><h1>The Story of Us</h1><p style="color:#9edff6!important">her sky blue 💙</p><p style="color:#e08a91!important">and a little red ❤️</p>
  <p>Every page holds a memory.</p>
  <div class="sticker" style="top:10%; right:10%; font-size:40px">📔</div>
  </div>`
  },
  {title:"The Beginning",date:"4 September 2022",html:`
  <div class="chapter"><div class="kicker">📖 Chapter 1</div><h2>🌱 The Beginning</h2><div class="date">4 September 2022 · Lucknow</div>
  <p>📍 It all began in Lucknow.</p>
  <p>We both came there to stay in hostels and continue our studies. There was a joining program at the Ganna Sansthan.</p>
  <p>We were in the same place at the same time.</p>
  <p>Two strangers. One story waiting to begin.</p>
  <div class="sticker" style="bottom:15%; left:10%">🚌</div>
  </div>`},
  {title:"The First Glimpse",html:`
  <div class="chapter"><div class="kicker">👀 Chapter 2</div><h2>✨ The First Glimpse</h2>
  <p>I don't remember the exact date.</p><p>During class, Rakesh Sir called me to solve a question on the board.</p>
  <p>I went to the board, and after turning around...</p><p class="highlight">👀 I saw you.</p>
  <p>After seeing you for the first time, I got a feeling I couldn't explain. I just knew it felt really nice.</p>
  <p>Then I started seeing you hiddenly in the bus.</p>
  <div class="sticker" style="top:15%; right:15%">👨‍🏫</div>
  </div>`},
  {title:"Trying to Make You Laugh",html:`
  <div class="chapter"><div class="kicker">😂 Chapter 3</div><h2>💫 Trying to Make You Laugh</h2>
  <p>😂 I tried my silly and stupid jokes, hoping you would laugh.</p>
  <p>That was one of those little things I remember from that time.</p>
  <div class="sticker" style="bottom:20%; right:15%">🤡</div>
  </div>`},
  {title:"The Ice Cream",html:`
  <div class="chapter"><div class="kicker">🍦 Chapter 4</div><h2>🍦 The Ice Cream</h2>
  <p>🍦 I bought ice cream for the whole bus.</p>
  <p>But I bought a special one for you.</p>
  <p>I just didn't have the guts to give it to you. 😭😭😭</p>
  <div class="sticker" style="top:50%; left:10%">🍦</div>
  <div class="sticker" style="top:60%; right:10%; font-size:25px">🙈</div>
  </div>`},
  {title:"Online Classes",html:`
  <div class="chapter"><div class="kicker">💻 Chapter 5</div><h2>💻 Online Classes</h2>
  <p>I looked at you in the online class.</p>
  <p>But you...</p><p class="highlight">Gadhi kahi ki 😂 in Aditya Sir's voice.</p>
  <p>You tried to hide yourself .</p></div>`},
  {title:"Your Name",html:`
  <div class="chapter"><div class="kicker">😏 Chapter 6</div><h2>💌 Your Name</h2>
  <p>😏 My friends started teasing me by your name.</p></div>`},
  {title:"The Same Day",date:"9 April 2024",html:`
  <div class="chapter"><div class="kicker">🎓 Chapter 7</div><h2>📅 The Same Day</h2><div class="date">JEE Main Session 2 · 9 April 2024</div>
  <p>📅 Same date.</p><p>🕐 Same shift.</p><p>📍 Same examination centre.</p>
  <p>Another coincidence in our story.</p></div>`},
  {title:"Shukla Ji",html:`
  <div class="chapter"><div class="kicker">😂 Chapter 8</div><h2>😄 Shukla Ji</h2>
  <p>Shukla Ji teasing me with a smile, saying <b>“Upadhyay Ji.”</b> 😂</p>
  <p>That “Chalte hain” sounded like “let them spend time together.” 😂</p>
  <p>“Vo bag ka wahan aise hi fek ke aa jana, fir tumhe bulake lana.”</p>
  <p>However, you paid for yourself.</p><p><b>Khuddar bachchi. 😂</b></p>
  <p>Waise aaj bhi tum hi payment karti ho. 😂😂😂</p>
  <p>I am in debt. I will pay you back by taking you to so many places where we will explore together.</p></div>`},
  {title:"A Little Conversation",html:`
  <div class="chapter"><div class="kicker">💬 Chapter 9</div><h2>💬 A Little Conversation</h2>
  <p>Then came the JEE Advanced paper.</p>
  <p>After that, we started having a little conversation. Maybe not every day.</p>
  <p>Just little conversations, day after day.</p></div>`},
  {title:"The Proposal",html:`
  <div class="chapter"><div class="kicker">❤️ Chapter 10</div><h2>💌 The Proposal</h2>
  <p>💌 Then came my proposal to you.</p>
  <p>And what did you do?</p><p class="highlight">You slept without replying. 😂😂😂</p>
  <p>I was expecting to be blocked from you. You didn't do that that time, but now you do after every fight. 😂😂</p>
  <p>Sorry for the fights btw.</p></div>`},
  {title:"Our Everyday Days",html:`
  <div class="chapter"><div class="kicker">🌻 Chapter 11</div><h2>🏡 Our Everyday Days</h2>
  <p>Then came our daily routine.</p>
  <p>But after that, I did so many blunders, kept you in tears, and I am really ashamed and sorry for that.</p>
  <p>I don't have enough words to apologize for all of it.</p></div>`},
  {title:"Us",html:`
  <div class="chapter"><div class="kicker">❤️ Chapter 12</div><h2>💑 Us</h2>
  <p>❤️ Then our relationship started and we became a couple.</p>
  <p>I had many bad habits which I left because of you.</p>
  <p class="highlight">You are a gem. 💎</p></div>`},
  {title:"Our First Date",date:"11 July 2025 · Lucknow",html:`
  <div class="chapter"><div class="kicker">🥰 Chapter 13</div><h2>🌹 Our First Date</h2><div class="date">11 July 2025 · Lucknow</div>
  <p>👭 You came with your sister in Lucknow. 🌧️ It was raining, but somehow I managed to meet you.</p>
  <p>That embarrassing moment: <b>“Menu kaha hai?”</b> 😭😭😭</p>
  <p>I had never gone to McDonald's before. Thanks for the help, ma'am.</p>
  <p>Aur wahan bhi maine besharmo ki tarah aapse paise bharwa diye. 😪😪😪</p>
  <p>📍 We met at Palassio, then went to Hanuman Dham. 🎁 I gave you the hand bracelet.</p>
  <p>Those selfies with you, those blushes — I still remember them.</p>
  <p>That jhule wala video.</p>
  <p>And taking that ice cream wrapper from you... as I told you many times, it took so much guts. 😭😭😭</p></div>`},
  {title:"Our First Big Fight",date:"Around 24 July 2025",html:`
  <div class="chapter"><div class="kicker">😤 Chapter 14</div><h2>⚡ Our First Big Fight</h2><div class="date">Around 24 July 2025</div>
  <p>Then came our first big fight after we got into a relationship.</p>
  <p>And maybe it was necessary to let me know that I approached you, so I should keep my attitude in my pocket. 😂😂</p>
  <p>A lesson I probably needed to learn.</p><p>And many more lessons...</p></div>`},
  {title:"Another Day in Lucknow",date:"25 December 2025",html:`
  <div class="chapter"><div class="kicker">🌆 Chapter 15</div><h2>❤️ Another Day in Lucknow</h2><div class="date">25 December 2025</div>
  <p>This time, you came alone.</p><p>We had already planned our whole day.</p>
  <p>But when I look back at that day, I realize how I behaved and how I made you angry in every place.</p>
  <p>Then we went to Fresh Factory. It was an amazing experience. Some clingy clips, I loved it.</p>
  <p>Then I gave you 2 flowers, a small sorry, not gone as I had planned.</p>
  <p>Then Cinepolis, and we watched <i>Tu Meri Main Tera Tu Meri Main Tera</i>.</p>
  <p>Then we came out in between and roamed in Janeshwar Mishra Park.</p>
  <p>And in the end again, there was rubbish behaviour from my side.</p>
  <p>I look back and it feels very disappointing.</p><p>Then after dropping you, I kissed your hands. That was great, peak.</p></div>`},
  {title:"A Day Together",date:"16 January 2026",html:`
  <div class="chapter"><div class="kicker">🙏 Chapter 16</div><h2>❤️ A Day Together</h2><div class="date">16 January 2026</div>
  <p>Then I met you again.</p><p>It was an amazing day. We spent the whole day together.</p>
  <p>🙏 We visited a temple just outside the railway station. We prayed together.</p>
  <p>You felt uncomfortable in the sunlight, and it was my pleasure to give you a small <b>chhaya of my body</b>.</p>
  <p>Then we went to City Centre and explored it together. We took many pictures there.</p>
  <p>We had chole bhature and momos, and later watched <i>Happy Patel Khatarnak Jasoos</i>. Actually, movie first.</p>
  <p>I kissed you so many times… 🫠🫠🫠🫠🫠</p><p>And while coming back, you gently massaged my head.</p>
  <p class="highlight">Ohhh ji… love you ji.</p></div>`},
  {title:"The Next Day",date:"17 January 2026",html:`
  <div class="chapter"><div class="kicker">🎁 Chapter 17</div><h2>❤️ The Next Day</h2><div class="date">17 January 2026</div>
  <p>Then I came inside your college.</p><p>🪑 We sat on that mini PMC and had a great time together.</p>
  <p>🎁 You gave me that neck chain. <b>Thank youuuu soooo much. ❤️</b></p>
  <p>We also ate Maggi on the 16th with your hands. It might have been my second time. The first was made by my brother and the second by you. It was delicious.</p>
  <p>Then chowmein — my very first time.</p><p>And sandwich too. Lucky to eat it by your hands.</p>
  <p>Then we went to the CSE building and the terrace.</p>
  <p>🤗 We had a long, long hug, nearly 30 minutes.</p>
  <p>Then came our first lip kiss. It wasn't good due to my tongue. 😭😭😭 Sorry.</p>
  <p>When you felt uncomfortable, I am sorry for not respecting that properly.</p>
  <p>Then we sat there but had nothing to say.</p>
  <p>Then we came below, charged your mobile, and went to La Pino'z.</p>
  <p>We had a great time there.</p><p><b>Waise maine baal kharab kar diye the 😂😂😂</b></p></div>`},
  {title:"The Best Memory",date:"17 April 2026",html:`<div class="chapter"><div class="kicker">❤️ Chapter 18</div><h2>🥹 The Best Memory</h2><div class="date">17 April 2026</div><p>Then we met again.</p><p>After everything, I was so sad.</p><p>And then you just said, <b>“Aja.”</b> 🥹</p><p>I thought you just wanted to delete all the pictures.</p><p>But then... you held my hand.</p><p>And that moment was just <b>amazing</b>. ❤️</p><p>I loved it.</p><p>I don't think I have ever felt better than I did in that moment.</p><p><b>Never.</b></p><p>Out of everything we've experienced together... this was our best memory. 🫶</p></div>`},
  {title:"The Next Few Days",date:"18–20 April 2026",html:`<div class="chapter"><div class="kicker">🎬 Chapter 19</div><h2>🎬 The Next Few Days</h2><div class="date">After 17 April 2026</div><p>The very next day was the NPTEL exam.</p><p>We went there together, and after that, we visited the mall and watched <i>Bhoot Bangla</i>. 🎬</p><p>And somehow, this became the only movie where we didn't even hold hands. 😂</p><p>Because... <b>it was a big fight.</b> 😭😂</p><p>Then we came to Bihta.</p><p>The next day, we tried to go to Patna, but couldn't because of some <b>“min”</b>. 😭</p><p>So instead, we enjoyed our time in Bihta itself.</p><p>We watched <i>Dacoit</i>. 🎬</p><p>And obviously... I was calling it <b>“daaacoitt”</b>. 😂😂😂</p><p>Another few days. Another few memories. ❤️</p></div>`},
  {title:"And The Story Continues",date:"6 June 2026",html:`<div class="chapter"><div class="kicker">🌹 Chapter 20</div><h2>❤️ And The Story Continues</h2><div class="date">6 June 2026</div><p>Then we had fights in between.</p><p>And eventually, we stopped talking.</p><p>Your last message from that time still makes me cry.</p><p>I've cried many times reading that message. 😭</p><p>Then, on <b>4 June</b>, you sent me a gift.</p><p>A flower from you. 🌹</p><p>A lovely rose.</p><p>Then on <b>5 June</b>, the lovely photo frame of us. 🥹❤️</p><p>I loved it sooo sooo much.</p><p>And then came <b>6 June 2026</b>.</p><p>You wished me <b>Happy Birthday</b>. 🎂❤️</p><p>And somehow... after everything, <b>the story continues.</b></p><p>And I hope this story... <b>never ends.</b> ♾️❤️</p><p class="highlight">To be continued... 📖✨</p></div>`},
  {title:"17 July 2026",date:"17 July 2026 · Lucknow",html:`<div class="chapter"><div class="kicker">🌆 Chapter 21</div><h2>❤️ 17 July 2026</h2><div class="date">Lucknow</div><p>Then we met again in Lucknow.</p><p>We went to the mall near the bus stand and had a Sprite and shake. 🥤</p><p>Then we went to the escape room.</p><p>It was so much fun. 😂❤️</p><p>We took pictures there too. 📸</p><p>Then came that <b>Fresh Factory thing</b> again. 😂😂😂</p><p>After that, we went to Riverfront Park and spent some time together.</p><p>There were so many little moments there that I didn't want the day to end.</p><p>I just wanted to stay there for the whole night. 🥹</p><p>Then came the <b>mobile switched-off</b> situation. 😭</p><p>Somehow, we managed to drop you at Mal Avenue.</p><p>And you had to tell a lie at home.</p><p>It was a really tough situation.</p><p>But somehow... <b>we made another memory. ❤️</b></p></div>`},
  {title:"Seeing You on Stage",date:"18 July 2026",html:`<div class="chapter"><div class="kicker">🎤 Chapter 22</div><h2>😂 Seeing You on Stage</h2><div class="date">18 July 2026</div><p>Then came the next day.</p><p>I saw you on stage. 🎤✨</p><p>And I just couldn't control my laugh. 😂😂</p><p>Seeing you there on stage was such a different feeling.</p><p>Just one look at you... and there I was, laughing again. ❤️</p><p>Another small moment.</p><p>Another memory.</p><p><b>18 July 2026 — saved forever. 📖✨</b></p></div>`},
  {title:"The Unexpected Day",date:"19 July 2026",html:`<div class="chapter"><div class="kicker">🎬 Chapter 23</div><h2>❤️ The Unexpected Day</h2><div class="date">19 July 2026</div><p>Everything went completely unexpected. You got your periods, and plans changed. We went to the movie theatre—just us. We spent that time being close.</p><p>Those khatarnak level ki kisses and licking... 🫠 and those amazing moments when you came on my chest and when I was fully on yours. Such a childish and comforting feeling.</p><p>And when you licked me... ohhhh, that current! ⚡ And that chocolate kiss... ahhh. 🍫❤️</p><p>It was an unexpected day, but it became a beautiful memory.</p><p><b>Another page in our story. 📖❤️</b></p></div>`},

  ];

  const book=document.getElementById('book');
  chapters.forEach((c,i)=>{
   const p=document.createElement('section');
   p.className='page'+(c.cover?' cover':'');
   p.innerHTML=c.html;
   p.dataset.index=i;

   /* Photo library removed for now */
   book.appendChild(p);
  });
  let current=0;
  const pages=[...document.querySelectorAll('.page')];
  function render(){
   pages.forEach((p,i)=>{
     const flipped=i<current;
     p.classList.toggle('flipped',flipped);
     p.style.zIndex=flipped ? i : (2000-i);
   });
   if(pages[current]) pages[current].style.zIndex=3000;
   document.getElementById('counter').textContent=`${current+1} / ${pages.length}`;
   document.getElementById('prev').disabled=current===0;
   document.getElementById('next').disabled=current===pages.length-1;
   document.getElementById('progress').style.width=(current/(pages.length-1)*100)+'%';
  }
  function next(){if(current<pages.length-1){current++;render()}}
  function prev(){if(current>0){current--;render()}}
  document.getElementById('next').onclick=next;
  document.getElementById('prev').onclick=prev;
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
  let startX=0;
  book.addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});
  book.addEventListener('touchend',e=>{
   const dx=e.changedTouches[0].clientX-startX;
   if(Math.abs(dx)>45) dx<0?next():prev();
  },{passive:true});
  const drawer=document.getElementById('drawer');
  const list=document.getElementById('chapterList');
  chapters.forEach((c,i)=>{
    const b=document.createElement('button');
    b.textContent=(i===0?'📖 ':` ${i}. `)+(c.title||'');
    b.style.cssText='display:block;width:100%;text-align:left;padding:10px 12px;color:#ead9b9;border-radius:8px';
    b.onclick=()=>{current=i;const lightbox=document.getElementById('photoLightbox');
  document.getElementById('lightboxClose').onclick=()=>lightbox.classList.remove('open');
  lightbox.onclick=(e)=>{if(e.target===lightbox)lightbox.classList.remove('open')};
  document.addEventListener('keydown',e=>{if(e.key==='Escape')lightbox.classList.remove('open')});
  render();drawer.style.display='none'};
    list.appendChild(b);
  });
  document.getElementById('menuBtn').onclick=()=>{
    drawer.style.display=drawer.style.display==='none'?'block':'none';
  };
  render();

  // Floating Hearts Logic
  function spawnHeart(x, y, isInteractive = false) {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = ['❤️', '💖', '✨', '💙'][Math.floor(Math.random() * 4)];
    heart.style.left = (x || Math.random() * 100 + 'vw') + (x ? 'px' : '');
    heart.style.bottom = y ? (window.innerHeight - y) + 'px' : '-20px';
    heart.style.fontSize = (Math.random() * (isInteractive ? 15 : 10) + 10) + 'px';
    heart.style.animationDuration = (Math.random() * 2 + (isInteractive ? 1 : 3)) + 's';
    if(isInteractive) {
      heart.style.position = 'fixed';
      heart.style.zIndex = '5000';
    }
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), isInteractive ? 2000 : 5000);
  }

  setInterval(() => spawnHeart(), 600);

  // Hover Heart Interaction
  document.addEventListener('mousemove', e => {
    if (e.target.closest('.chapter p, .sticker, h2, .cover-inner, button')) {
      if (Math.random() > 0.85) {
        spawnHeart(e.clientX, e.clientY, true);
      }
    }
  });

  // Sticker Draggable Logic
  document.addEventListener('mousedown', e => {
    if (e.target.classList.contains('sticker')) {
      const s = e.target;
      let shiftX = e.clientX - s.getBoundingClientRect().left;
      let shiftY = e.clientY - s.getBoundingClientRect().top;

      function moveAt(pageX, pageY) {
        const parentRect = s.parentElement.getBoundingClientRect();
        s.style.left = (pageX - parentRect.left - shiftX) + 'px';
        s.style.top = (pageY - parentRect.top - shiftY) + 'px';
        s.style.right = 'auto';
        s.style.bottom = 'auto';
      }

      function onMouseMove(e) { moveAt(e.pageX, e.pageY); }
      document.addEventListener('mousemove', onMouseMove);

      document.onmouseup = function() {
        document.removeEventListener('mousemove', onMouseMove);
        document.onmouseup = null;
      };
    }
  });

  // Prevent default drag for stickers
  document.addEventListener('dragstart', e => {
    if (e.target.classList.contains('sticker')) e.preventDefault();
  });
</script>
